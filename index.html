<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Pesa STK Push Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
    }
    h2 { margin-top: 0; color: #1b5e20; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1b5e20; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef7ee;
      color: #1b5e20;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>M-Pesa Push Simulation</h2>
    <form id="mpesaForm">
      <label for="phone">Phone Number (2547...)</label>
      <input id="phone" type="tel" placeholder="254712345678" required />

      <label for="amount">Amount (KES)</label>
      <input id="amount" type="number" min="1" placeholder="100" required />

      <button type="submit">Send STK Push (Simulated)</button>
    </form>
    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const form = document.getElementById("mpesaForm");
    const statusBox = document.getElementById("statusBox");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const phone = document.getElementById("phone").value.trim();
      const amount = document.getElementById("amount").value.trim();

      statusBox.style.display = "block";
      statusBox.style.background = "#fff8e1";
      statusBox.style.color = "#8d6e00";
      statusBox.innerHTML =
        `<strong>STK Push Sent (Simulated)</strong><br>` +
        `Prompting <b>${phone}</b> for <b>KES ${amount}</b>... Enter M-Pesa PIN on handset.`;

      setTimeout(() => {
        const receipt = "SIM" + Math.random().toString(36).substring(2, 8).toUpperCase();
        statusBox.style.background = "#eef7ee";
        statusBox.style.color = "#1b5e20";
        statusBox.innerHTML =
          `<strong>Payment Confirmed (Simulated)</strong><br>` +
          `Receipt: <b>${receipt}</b><br>` +
          `KES ${amount} from ${phone}.<br>` +
          `<small>Note: Front-end simulation only; no real Daraja STK push sent.</small>`;
      }, 2500);
    });
  </script>
</body>
</html>
